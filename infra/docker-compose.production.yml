name: videoanalyze-production

x-node: &node
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-database: &database
  DATABASE_URL: postgres://videoanalyze@postgres:5432/videoanalyze
  DATABASE_PASSWORD_FILE: /run/secrets/db_password

x-storage: &storage
  S3_ENDPOINT: http://storage:3900
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-videoanalyze}
  S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: videoanalyze
      POSTGRES_USER: videoanalyze
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U videoanalyze -d videoanalyze"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    logging: *logging

  storage:
    build: { context: .., dockerfile: infra/storage/Dockerfile }
    image: videoanalyze-storage:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-videoanalyze}
      RUST_LOG: garage=warn
    secrets: [s3_access_key, s3_secret_key, storage_rpc_secret]
    volumes:
      - storage-data:/var/lib/garage
      - ./storage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: [CMD, /garage, status]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    logging: *logging

  storage-init:
    <<: *node
    restart: "no"
    image: videoanalyze-api:${IMAGE_TAG:-local}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *storage
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    secrets: [s3_access_key, s3_secret_key]
    depends_on:
      storage: { condition: service_healthy }
    command: [node, configure-storage.mjs]

  migrate:
    <<: *node
    restart: "no"
    image: videoanalyze-api:${IMAGE_TAG:-local}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: *database
    secrets: [db_password]
    depends_on:
      postgres: { condition: service_healthy }
    command: [node, dist/db/migrate.js]

  api:
    <<: *node
    image: videoanalyze-api:${IMAGE_TAG:-local}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      <<: [*database, *storage]
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      S3_PUBLIC_ENDPOINT: ${STORAGE_HOST:?set STORAGE_HOST}
      VERIFICATION_BASE_URL: ${PUBLIC_HOST:?set PUBLIC_HOST}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:-smtp.163.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      MAIL_FROM_ADDRESS: ${SMTP_USER:?set SMTP_USER}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-十一视频笔记}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-100}
      MAIL_RECIPIENT_DAILY_LIMIT: ${MAIL_RECIPIENT_DAILY_LIMIT:-10}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-20}
      MAX_TOTAL_QUEUED_RUNS: ${MAX_TOTAL_QUEUED_RUNS:-20}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000000}
      TEMP_MEDIA_CAPACITY_BYTES: ${TEMP_MEDIA_CAPACITY_BYTES:-40000000000}
    secrets: [db_password, s3_access_key, s3_secret_key, smtp_password]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  worker:
    <<: *node
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    image: videoanalyze-worker:${IMAGE_TAG:-local}
    environment:
      <<: [*database, *storage]
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      GROQ_ASR_MODEL: ${GROQ_ASR_MODEL:-whisper-large-v3-turbo}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:?set LLM_API_BASE_URL}
      LLM_API_MODEL: ${LLM_API_MODEL:?set LLM_API_MODEL}
      LLM_API_PROTOCOL: ${LLM_API_PROTOCOL:-auto}
      GLOBAL_WORKER_CONCURRENCY: ${GLOBAL_WORKER_CONCURRENCY:-2}
      FFMPEG_CONCURRENCY: ${FFMPEG_CONCURRENCY:-1}
      LONG_VIDEO_CONCURRENCY: ${LONG_VIDEO_CONCURRENCY:-1}
    secrets: [db_password, s3_access_key, s3_secret_key, groq_api_key, llm_api_key]
    depends_on:
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 60s

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    image: videoanalyze-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
      STORAGE_HOST: ${STORAGE_HOST:?set STORAGE_HOST}
      STORAGE_UPSTREAM: storage:3900
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    volumes:
      - ./reverse-proxy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: [no-new-privileges:true]
    logging: *logging

secrets:
  storage_rpc_secret: { file: "${SECRETS_DIR:-../.local/production-secrets}/storage_rpc_secret" }
  db_password: { file: "${SECRETS_DIR:-../.local/production-secrets}/db_password" }
  s3_access_key: { file: "${SECRETS_DIR:-../.local/production-secrets}/s3_access_key" }
  s3_secret_key: { file: "${SECRETS_DIR:-../.local/production-secrets}/s3_secret_key" }
  smtp_password: { file: "${SECRETS_DIR:-../.local/production-secrets}/smtp_password" }
  groq_api_key: { file: "${SECRETS_DIR:-../.local/production-secrets}/groq_api_key" }
  llm_api_key: { file: "${SECRETS_DIR:-../.local/production-secrets}/llm_api_key" }

volumes:
  postgres-data:
  redis-data:
  storage-data:
  caddy-data:
  caddy-config:
