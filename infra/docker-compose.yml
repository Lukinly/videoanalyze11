name: videoan

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videoanalyze
      POSTGRES_USER: videoanalyze
      POSTGRES_PASSWORD: videoanalyze
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoanalyze -d videoanalyze"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../apps/api/src/db/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-https://localhost,http://localhost}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} && mc mb --ignore-existing local/${S3_BUCKET:-videoanalyze}"]

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://videoanalyze:videoanalyze@postgres:5432/videoanalyze
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js"]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://videoanalyze:videoanalyze@postgres:5432/videoanalyze
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://storage.localhost}
      MAIL_API_URL: http://mailpit:8025/api/v1/send
      MAX_QUEUED_RUNS_PER_USER: ${MAX_QUEUED_RUNS_PER_USER:-2}
      MAX_TOTAL_QUEUED_RUNS: ${MAX_TOTAL_QUEUED_RUNS:-20}
      MAX_QUEUE_WAIT_SECONDS: ${MAX_QUEUE_WAIT_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://videoanalyze:videoanalyze@postgres:5432/videoanalyze
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      NODE_USE_ENV_PROXY: "1"
      GLOBAL_WORKER_CONCURRENCY: ${GLOBAL_WORKER_CONCURRENCY:-2}
      FFMPEG_CONCURRENCY: ${FFMPEG_CONCURRENCY:-1}
      LONG_VIDEO_CONCURRENCY: ${LONG_VIDEO_CONCURRENCY:-1}
      LONG_VIDEO_THRESHOLD_SECONDS: ${LONG_VIDEO_THRESHOLD_SECONDS:-7200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  backup:
    build:
      context: ..
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://videoanalyze:videoanalyze@postgres:5432/videoanalyze
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
      - minio
    environment:
      CADDYFILE: ${CADDYFILE:-Caddyfile}
      PUBLIC_HOST: ${PUBLIC_HOST:-https://localhost}
      STORAGE_HOST: ${STORAGE_HOST:-https://storage.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
